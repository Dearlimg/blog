app:
  name: Blog
  version: v0.0.0
  start_time: 2025.5.7
  port: 0.0.0.0:8002
mysql:
  dns: root:sta_go@tcp(43.138.26.45:3307)/blog?charset=utf8mb4&parseTime=True&loc=Local
redis:
  addr: 43.138.26.45:6379
  password: sta_go
  db: 0
log:
  level: info          # 日志级别: debug, info, warn, error
  format: json         # 日志格式: json, text
  output: file        # 输出位置: stdout, file, both
  file_path: logs/blog.log
  max_size: 100       # 单个日志文件最大大小（MB）
  max_backups: 10     # 保留的备份文件数量
  max_age: 30         # 保留日志文件的天数
  compress: true      # 是否压缩旧日志文件
ollama:
  base_url: http://localhost:11434  # Ollama API 基础URL
  model: deepseek-r1:8b             # 默认模型
  timeout: 120                      # 请求超时时间（秒）
eino:
  max_history: 20                   # 最大历史记录数
cache:
  enabled: true                     # 缓存开关
  default_expire: 5m                # 默认缓存过期时间
  min_expire: 5m                    # 最小随机过期时间
  max_expire: 10m                   # 最大随机过期时间
  hot_data_expire: 30m              # 热点数据缓存时间
  cache_version_enabled: true       # 是否启用缓存版本号
